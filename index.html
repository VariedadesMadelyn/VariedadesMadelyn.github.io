            <!-- Teléfono -->

                    <i class="fa-brands fa-tiktok"></i>

            <a href="https://www.instagram.com/varmadelyn_?exln=MWpsdWJoaHBsNjQ3Mg==" target="_blank" rel="noopener noreferrer" class="link-card instagram-card">

    </main>

    <!-- Scripts -->
    <script>
        // Actualizar año dinámicamente
        document.getElementById('year').textContent = new Date().getFullYear();

        // Sistema de Partículas (Mayor cantidad: 70 partículas)
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        const numberOfParticles = 70; // Aumentado para mayor presencia

        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        setCanvasSize();

        window.addEventListener('resize', () => {
            setCanvasSize();
            initParticles();
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.2 + 0.6; // Tamaños sutiles variados
                this.speedX = (Math.random() - 0.5) * 0.25; 
                this.speedY = -Math.random() * 0.35 - 0.1; // Flotación suave hacia arriba
                this.opacity = Math.random() * 0.35 + 0.15; // Opacidad elegante
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Reiniciar posición si sale de los límites
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
